<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARUVI HOSTEL Mess Menu</title>
    <link rel="stylesheet" href="mess.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #001f3f;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #001f3f;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }
        h2 {
            color: #001f3f;
            font-size: 1.8em;
            margin-bottom: 20px;
        }
        .today-menu {
            background: #f0f8ff;
            border: 2px solid #001f3f;
            padding: 30px;
            margin: 20px auto;
            width: 90%;
            max-width: 800px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 31, 63, 0.1);
        }
        .today-menu h2 {
            margin-top: 0;
            color: #001f3f;
        }
        .today-menu p {
            font-size: 1.2em;
            margin: 10px 0;
            color: #001f3f;
        }
        .weekly-menu {
            margin: 40px auto;
            width: 90%;
            max-width: 1000px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 31, 63, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #001f3f;
            padding: 15px;
            text-align: left;
        }
        th {
            background-color: #001f3f;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #e6f3ff !important;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 2em;
            }
            .today-menu {
                padding: 20px;
                width: 100%;
            }
            table {
                font-size: 0.9em;
            }
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <h1>ARUVI HOSTEL Mess Menu</h1>
    <div id="today-menu" class="today-menu">
        <h2>Today's Menu</h2>
        <p id="today-breakfast"></p>
        <p id="today-lunch"></p>
        <p id="today-dinner"></p>
    </div>
    <div class="weekly-menu">
        <h2>Weekly Menu</h2>
        <table id="menu-table">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Breakfast</th>
                    <th>Lunch</th>
                    <th>Dinner</th>
                </tr>
            </thead>
            <tbody id="menu-body">
            </tbody>
        </table>
    </div>
    <script>
        // Function to get week number
        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        // Menus for 4 weeks
        const menus = {
            1: {
                Monday: { breakfast: "Eggs, Milk, Bread", lunch: "Chicken Biryani, Raita", dinner: "Mutton Curry, Rice, Salad" },
                Tuesday: { breakfast: "Omelette, Juice", lunch: "Fish Curry, Rice, Dal", dinner: "Chicken Tikka, Roti, Vegetables" },
                Wednesday: { breakfast: "Poha, Eggs", lunch: "Paneer Butter Masala, Naan", dinner: "Fish Fry, Rice, Chutney" },
                Thursday: { breakfast: "Idli, Sambar, Eggs", lunch: "Egg Curry, Rice", dinner: "Mutton Biryani, Salad" },
                Friday: { breakfast: "Paratha, Yogurt", lunch: "Chicken Masala, Rice", dinner: "Prawn Curry, Roti" },
                Saturday: { breakfast: "Upma, Milk", lunch: "Fish Biryani, Raita", dinner: "Chicken Curry, Rice" },
                Sunday: { breakfast: "Dosa, Eggs", lunch: "Mutton Masala, Naan", dinner: "Fish Tikka, Salad" }
            },
            2: {
                Monday: { breakfast: "Scrambled Eggs, Toast", lunch: "Dal Tadka, Chicken", dinner: "Beef Stew, Bread" },
                Tuesday: { breakfast: "Boiled Eggs, Juice", lunch: "Paneer Tikka, Rice", dinner: "Chicken Biryani, Salad" },
                Wednesday: { breakfast: "Egg Bhurji, Bread", lunch: "Fish Masala, Roti", dinner: "Mutton Fry, Rice" },
                Thursday: { breakfast: "Omelette, Milk", lunch: "Chicken Curry, Naan", dinner: "Fish Curry, Salad" },
                Friday: { breakfast: "Idli, Eggs", lunch: "Egg Fried Rice, Chicken", dinner: "Prawn Masala, Roti" },
                Saturday: { breakfast: "Pancakes, Eggs", lunch: "Mutton Biryani, Raita", dinner: "Chicken Tikka, Rice" },
                Sunday: { breakfast: "French Toast, Milk", lunch: "Fish Fry, Dal", dinner: "Beef Curry, Bread" }
            },
            3: {
                Monday: { breakfast: "Eggs Benedict, Juice", lunch: "Chicken Tandoori, Rice", dinner: "Mutton Kebab, Salad" },
                Tuesday: { breakfast: "Omelette, Toast", lunch: "Fish Biryani, Yogurt", dinner: "Chicken Curry, Roti" },
                Wednesday: { breakfast: "Boiled Eggs, Bread", lunch: "Paneer Masala, Naan", dinner: "Fish Tikka, Rice" },
                Thursday: { breakfast: "Scrambled Eggs, Milk", lunch: "Egg Curry, Rice", dinner: "Mutton Masala, Salad" },
                Friday: { breakfast: "Dosa, Eggs", lunch: "Chicken Biryani, Raita", dinner: "Prawn Fry, Roti" },
                Saturday: { breakfast: "Upma, Juice", lunch: "Fish Curry, Dal", dinner: "Chicken Kebab, Rice" },
                Sunday: { breakfast: "Paratha, Yogurt", lunch: "Mutton Curry, Naan", dinner: "Fish Masala, Salad" }
            },
            4: {
                Monday: { breakfast: "Egg Muffins, Milk", lunch: "Chicken Masala, Rice", dinner: "Beef Biryani, Salad" },
                Tuesday: { breakfast: "Omelette, Bread", lunch: "Fish Tikka, Roti", dinner: "Mutton Curry, Rice" },
                Wednesday: { breakfast: "Egg Salad, Juice", lunch: "Paneer Biryani, Yogurt", dinner: "Chicken Fry, Salad" },
                Thursday: { breakfast: "Boiled Eggs, Toast", lunch: "Egg Masala, Rice", dinner: "Fish Curry, Roti" },
                Friday: { breakfast: "Idli, Eggs", lunch: "Mutton Biryani, Raita", dinner: "Prawn Tikka, Rice" },
                Saturday: { breakfast: "Poha, Milk", lunch: "Chicken Curry, Naan", dinner: "Fish Kebab, Salad" },
                Sunday: { breakfast: "Dosa, Yogurt", lunch: "Paneer Tikka, Rice", dinner: "Mutton Fry, Roti" }
            }
        };

        // Get current date
        const now = new Date();
        const weekNum = getWeekNumber(now) % 4 || 4; // 1-4
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const todayName = dayNames[now.getDay()];

        // Display today's menu
        const todayMeals = menus[weekNum][todayName];
        document.getElementById('today-breakfast').textContent = `Breakfast: ${todayMeals.breakfast}`;
        document.getElementById('today-lunch').textContent = `Lunch: ${todayMeals.lunch}`;
        document.getElementById('today-dinner').textContent = `Dinner: ${todayMeals.dinner}`;

        // Display weekly menu
        const menuBody = document.getElementById('menu-body');
        dayNames.forEach(day => {
            const row = document.createElement('tr');
            if (day === todayName) {
                row.classList.add('highlight');
            }
            row.innerHTML = `
                <td>${day}</td>
                <td>${menus[weekNum][day].breakfast}</td>
                <td>${menus[weekNum][day].lunch}</td>
                <td>${menus[weekNum][day].dinner}</td>
            `;
            menuBody.appendChild(row);
        });
    </script>
</body>
</html>
