<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messcut</title>
    <link rel="stylesheet" href="mess.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f8fb;
            color: #001f3f;
            margin: 0;
            padding: 0;
        }
        .page-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            font-size: 2.6rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        h2 {
            margin: 0 0 10px;
            font-size: 1.5rem;
            color: #001f3f;
        }
        .subtitle {
            margin: 0 0 24px;
            color: #40506b;
            line-height: 1.5;
        }
        .card {
            background: #ffffff;
            border: 1px solid rgba(0, 31, 63, 0.15);
            border-radius: 14px;
            padding: 26px;
            margin-bottom: 24px;
            box-shadow: 0 10px 18px rgba(0, 31, 63, 0.08);
            width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #001f3f;
        }
        input[type="date"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(0, 31, 63, 0.25);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            grid-column: 1 / -1;
            justify-self: center;
            width: 220px;
            padding: 12px 16px;
            background: #001f3f;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background: #002a5e;
        }
        button:disabled {
            background: rgba(0, 31, 63, 0.5);
            cursor: not-allowed;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            border: 1px solid rgba(0, 31, 63, 0.2);
            padding: 12px 14px;
            text-align: left;
        }
        th {
            background: #001f3f;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        tr:nth-child(even) {
            background: #f2f7ff;
        }
        .empty {
            text-align: center;
            color: #546a82;
            padding: 20px;
        }
        @media (max-width: 640px) {
            .page-container {
                padding: 24px 12px;
            }
            form {
                grid-template-columns: 1fr;
            }
            button {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        

        <div class="card">
            <h2>Request a Mess Cut</h2>
            <p class="subtitle">Add a start and end date below to request a mess cut. Past requests appear in the table below.</p>

            <form id="messcut-form">
                <div>
                    <label for="start">Start Date</label>
                    <input type="date" id="start" required>
                </div>
                <div>
                    <label for="end">End Date</label>
                    <input type="date" id="end" required>
                </div>
                <button type="submit">Add Mess Cut</button>
            </form>
        </div>

        <div class="card">
            <h2>Past Mess Cuts</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Added</th>
                    </tr>
                </thead>
                <tbody id="cut-body">
                    <tr>
                        <td colspan="4" class="empty">No mess cuts yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'messcuts';

        function loadMessCuts() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        function saveMessCuts(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function formatDate(value) {
            if (!value) return '';
            const date = new Date(value);
            return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function renderList() {
            const cuts = loadMessCuts();
            const body = document.getElementById('cut-body');
            body.innerHTML = '';

            if (!cuts.length) {
                body.innerHTML = '<tr><td colspan="4" class="empty">No mess cuts yet.</td></tr>';
                return;
            }

            cuts.forEach((cut, idx) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${formatDate(cut.start)}</td>
                    <td>${formatDate(cut.end)}</td>
                    <td>${formatDate(cut.added)}</td>
                `;
                body.appendChild(row);
            });
        }

        document.getElementById('messcut-form').addEventListener('submit', (event) => {
            event.preventDefault();

            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            if (!start || !end) return;

            const cuts = loadMessCuts();
            cuts.unshift({ start, end, added: new Date().toISOString() });
            saveMessCuts(cuts);
            renderList();

            event.target.reset();
        });

        renderList();
    </script>
</body>
</html>
