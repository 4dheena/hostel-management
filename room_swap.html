<!DOCTYPE html>
<html>
<head>

<title>Room Swap Request</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(120deg,#ff9966,#ff5e62);
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding:40px 0;
}

.container{
background:white;
padding:35px;
width:520px;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

.section{
margin-top:20px;
padding:15px;
border-radius:6px;
background:#f7f7f7;
}

.section h3{
margin-bottom:10px;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:6px;
border-radius:5px;
border:1px solid #ccc;
}

textarea{
resize:none;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#ff5e62;
border:none;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#e74c3c;
}

.checkbox{
margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<h2>Room Swap Request Form</h2>

<form id="swapForm">

<!-- Student 1 -->

<div class="section">

<h3>Student 1 (Requesting Swap)</h3>

<label>Student Name</label>
<input type="text" id="name1" required>

<label>Hostel ID</label>
<input type="text" id="hostelID1" required>

<label>Current Room Number</label>
<input type="text" id="room1" required>

</div>

<!-- Student 2 -->

<div class="section">

<h3>Student 2 (Agreeing to Swap)</h3>

<label>Student Name</label>
<input type="text" id="name2" required>

<label>Hostel ID</label>
<input type="text" id="hostelID2" required>

<label>Current Room Number</label>
<input type="text" id="room2" required>

</div>

<!-- Swap Details -->

<div class="section">

<h3>Swap Details</h3>

<label>Requested Room Number</label>
<input type="text" id="requestedRoom" required>

<label>Reason for Room Swap</label>
<textarea id="reason" rows="3"></textarea>

<div class="checkbox">
<label>
<input type="checkbox" required>
Both students confirm they agree to this room swap.
</label>
</div>

</div>

<button type="submit">Submit Room Swap Request</button>

</form>

</div>

<script>

document.getElementById("swapForm").addEventListener("submit",function(e){

e.preventDefault();

let swapRequest = {

student1:{
name:document.getElementById("name1").value,
hostelID:document.getElementById("hostelID1").value,
room:document.getElementById("room1").value
},

student2:{
name:document.getElementById("name2").value,
hostelID:document.getElementById("hostelID2").value,
room:document.getElementById("room2").value
},

requestedRoom:document.getElementById("requestedRoom").value,
reason:document.getElementById("reason").value,
status:"Pending"

};

let swaps = JSON.parse(localStorage.getItem("swapRequests")) || [];

swaps.push(swapRequest);

localStorage.setItem("swapRequests",JSON.stringify(swaps));

alert("Room Swap Request Submitted to Warden!");

this.reset();

});

</script>

</body>
</html>
